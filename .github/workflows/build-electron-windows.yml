name: Validate Windows Electron installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test DowFlow x64 on Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pnpm
        shell: pwsh
        run: npm install --global pnpm@11.25.0

      - name: Build Windows installer
        shell: pwsh
        run: pnpm --dir desktop/electron package:win

      - name: Run Python test suite
        shell: pwsh
        run: python -m unittest discover -v

      - name: Verify installer exists without uploading it
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "desktop/electron/release" -Filter "DowFlow-*-x64.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one DowFlow x64 NSIS installer; found $($installers.Count)."
          }
          $hash = Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256
          "Installer built: $($installers[0].Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "SHA-256: $($hash.Hash)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
